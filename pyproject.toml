[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mi-bias-research"
version = "0.1.0"
description = "Reproducible cross-model mechanistic bias research utilities"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24.0",
  "torch>=2.0.0",
  # TransformerLens 2.16.1's GPT-NeoX config adapter expects the Transformers 4.x API.
  "transformers==4.57.6",
  "transformer-lens==2.16.1",
  "scikit-learn>=1.3.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
